services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tetra
      POSTGRES_PASSWORD: tetra
      POSTGRES_DB: tetra
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tetra -d tetra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
